apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-manager
  template:
    metadata:
      labels:
        app: user-manager
    spec:
      containers:
        - name: user-manager
          image: user-manager:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000  # REST
            - containerPort: 50051 # gRPC
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Variabili da ConfigMap
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: dsbd-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: dsbd-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: dsbd-config
                  key: DB_USER
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: dsbd-config
                  key: DB_NAME_USER
            # Password da Secret
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dsbd-secrets
                  key: app-db-password
---
apiVersion: v1
kind: Service
metadata:
  name: user-manager-service
spec:
  selector:
    app: user-manager
  ports:
    - name: http
      protocol: TCP
      port: 5000
      targetPort: 5000
    - name: grpc
      protocol: TCP
      port: 50051
      targetPort: 50051